<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamyar · همیار</title>
    <meta name="description" content="A companion for easy integration in the UK. Interpreting, official letters and NHS and Home Office forms, in Farsi and Dari." />

    <!--
      The icon, generated from the wordmark by scripts/build-favicons.mjs.
      There was none at all before, so every tab showed a browser default and
      the app looked unowned in a phone's tab strip.

      The SVG first, for anything that will take it; the .ico for bookmark
      bars and older Windows; apple-touch-icon because iOS ignores both.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Added to the home screen is how a lot of people will keep this: a
      support worker sets it up once on a cheap Android and the person taps it
      after that, which is easier than remembering a web address in a second
      language.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e6e64" />
    <meta name="apple-mobile-web-app-title" content="Hamyar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
